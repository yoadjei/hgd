[project]
name = "hgd"
version = "0.1.0"
description = "Interventional decomposition of the horizon gap in long-horizon tool-using LLM agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# split by what a step actually needs, and deliberately NOT bundled. pip resolves
# an extra atomically, so pairing appworld with vllm meant vllm's source build
# failing on kaggle took appworld down with it and the cpu-only determinism gate
# could not run at all. the gate and the census need bench and nothing more.
bench = [
    "appworld==0.1.3.post1",
]
# gpu inference. vllm builds from source on most hosts and pulls a large tree;
# keep it away from anything that does not serve a model. requests lives here
# because only vllm_client uses it.
serve = [
    "vllm",
    "requests>=2.31",
]
# not imported anywhere yet; reserved for the phase 3 hazard glmm
stats = [
    "statsmodels>=0.14",
    "scipy>=1.13",
]
dev = [
    "pytest>=8",
    # appworld brings this transitively; declared here so the freezer-leak guard in
    # appworld_env is exercised against the real library rather than a stand-in. a
    # guard tested only against a mock of the thing it guards is not tested.
    # pinned to appworld 0.1.3.post1's own range, because the guard reads freezegun
    # internals: tests running on 1.5.5 while kaggle runs 1.5.1 would be testing a
    # different library from the one in production. 1.5.1 is the version whose line
    # numbers appeared in the real traceback.
    "freezegun>=1.5.0,<=1.5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
# real errors only: undefined names, syntax, likely bugs. these were passed on the
# command line until now, so `ruff check .` on a fresh clone used the defaults and
# reported thirty style findings the code was never held to. pinning them here is
# the point of a config file.
select = ["F", "E9", "B"]
