[project]
name = "hgd"
version = "0.1.0"
description = "Interventional decomposition of the horizon gap in long-horizon tool-using LLM agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# split by what a step actually needs, and deliberately NOT bundled. pip resolves
# an extra atomically, so pairing appworld with vllm meant vllm's source build
# failing on kaggle took appworld down with it and the cpu-only determinism gate
# could not run at all. the gate and the census need bench and nothing more.
bench = [
    "appworld==0.1.3.post1",
]
# gpu inference. vllm builds from source on most hosts and pulls a large tree;
# keep it away from anything that does not serve a model. requests lives here
# because only vllm_client uses it.
serve = [
    "vllm",
    "requests>=2.31",
]
# not imported anywhere yet; reserved for the phase 3 hazard glmm
stats = [
    "statsmodels>=0.14",
    "scipy>=1.13",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
